# Credentials come from environment variables - see application.properties.example
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/coliseumstats}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

server.port=8082

spring.mail.protocol=smtp
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender address for registration and password-reset codes
coliseum.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
